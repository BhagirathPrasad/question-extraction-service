version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Question Extraction Service — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env && edit .env
#   docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qes_password}
      POSTGRES_DB: ${POSTGRES_DB:-question_extraction}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qes_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Application ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qes_user}:${POSTGRES_PASSWORD:-qes_password}@db:5432/${POSTGRES_DB:-question_extraction}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-qes_user}:${POSTGRES_PASSWORD:-qes_password}@db:5432/${POSTGRES_DB:-question_extraction}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
      - .:/app                   # hot-reload in development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qes_user}:${POSTGRES_PASSWORD:-qes_password}@db:5432/${POSTGRES_DB:-question_extraction}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-qes_user}:${POSTGRES_PASSWORD:-qes_password}@db:5432/${POSTGRES_DB:-question_extraction}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # ── Flower (Celery Monitor — optional) ─────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - worker
    command: celery -A app.workers.celery_app flower --port=5555
    profiles:
      - monitoring

volumes:
  postgres_data:
  upload_data:
